name: CI

# The pull-request gate: runs on every pull request and on pushes to main, so
# nothing lands on the default branch unverified. It is also exposed via
# workflow_call, so the Release workflow reuses these exact checks instead of
# duplicating them (one source of truth for "is this code releasable").
#
# Third-party actions are pinned to full commit SHAs (immutable). Dependabot
# proposes updates.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

# Least privilege: these jobs only read the repo.
permissions: {}

# One run per ref; a new push cancels the in-flight run for that ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, types, dead code, unit tests, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The pnpm version comes from package.json's `packageManager`, not a
      # floating major, so CI resolves the lockfile with the pnpm that wrote it.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      # --ignore-scripts: no dependency needs a lifecycle script, and skipping
      # them keeps the install from running code we did not review.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm knip
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:demo

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
